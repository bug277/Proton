name: Build Proton Kernel APatch

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          ref: proton-main
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang lld llvm \
            gcc-aarch64-linux-gnu \
            make bc bison flex \
            libelf-dev libssl-dev python3

      - name: Disable KSU
        run: |
          if [ -f arch/arm64/configs/ksu.config ]; then
            sed -i 's/CONFIG_KSU=y/CONFIG_KSU=n/' \
              arch/arm64/configs/ksu.config
            sed -i 's/CONFIG_KSU_NEXT=y/CONFIG_KSU_NEXT=n/' \
              arch/arm64/configs/ksu.config
          fi
          sed -i 's/CONFIG_KSU=y/CONFIG_KSU=n/' \
            arch/arm64/configs/proton_defconfig || true

      - name: Build
        run: |
          export ARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export STRIP=llvm-strip
          export CROSS_COMPILE=aarch64-linux-gnu-
          make proton_defconfig
          make olddefconfig
          make -j$(nproc) Image

      - name: Upload
        uses: actions/upload-artifact@v3
        with:
          name: proton-kernel-apatch
          path: arch/arm64/boot/Image
