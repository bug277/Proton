name: Build Proton Kernel (APatch)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: proton
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu clang lld \
            make bc bison flex \
            libelf-dev libssl-dev python3 \
            binutils-aarch64-linux-gnu

      - name: Disable KSU, Enable APatch config
        run: |
          DEFCONFIG=arch/arm64/configs/exynos2100_defconfig
          sed -i 's/CONFIG_KSU=y/CONFIG_KSU=n/' $DEFCONFIG
          sed -i 's/CONFIG_KSU_NEXT=y/CONFIG_KSU_NEXT=n/' $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KPROBE_EVENTS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS=y" >> $DEFCONFIG
          echo "CONFIG_KALLSYMS_ALL=y" >> $DEFCONFIG

      - name: Build kernel
        run: |
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make exynos2100_defconfig
          make olddefconfig
          make -j$(nproc) Image

      - name: Upload kernel Image
        uses: actions/upload-artifact@v3
        with:
          name: proton-apatch-kernel
          path: arch/arm64/boot/Image
